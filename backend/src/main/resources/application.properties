server.port=8080

# Application Details
spring.application.name=MPLADS Rakshak Backend
app.version=1.0.0

# Database Configuration (Portable Embedded Analytical Mode / PostgreSQL Switch)
spring.datasource.url=jdbc:h2:file:./backend_data/mplads_db;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console (for debugging if needed)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Security & JWT Configuration
app.jwt.secret=9a3f8c4e2b1d7f6a5c8e3b2a1f4d6c8e9a3f8c4e2b1d7f6a5c8e3b2a1f4d6c8e
app.jwt.expiration-ms=86400000

# ML Engine Configuration
app.ml.service.url=http://127.0.0.1:8000
app.ml.service.timeout-ms=60000

# File Storage Configuration for CSV/Excel Ingestion
app.upload.dir=./uploads
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Default Risk Weights
app.risk.weight.cost=0.25
app.risk.weight.delay=0.20
app.risk.weight.rule=0.20
app.risk.weight.similarity=0.15
app.risk.weight.agency=0.10
app.risk.weight.fund=0.10
